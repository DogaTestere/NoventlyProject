<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/hologram.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="js/carousel.js" defer></script>

    <title>Visually</title>
  </head>
  <body>
    <header class="header">
      <div class="logo-area">
        <h1 class="logo">Visually</h1>
      </div>
      <nav>
        <ul>
          <li><a href="index.html">Anasayfa</a></li>
          <li><a href="drone.html">Drone Showları</a></li>
          <li><a class="led-text" href="LED.html">LED Ekranlar</a></li>
          <li>
            <a class="hologram flicker" href="hologram.html"
              >Hologram Sistemleri</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <div class="slider">
      <button class="slider--btn slider--btn__prev">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m15 18-6-6 6-6" />
        </svg>
      </button>

      <div class="slides__wrapper">
        <div class="slides">
          <div class="slide" data-current>
            <div class="slide__inner">
              <div class="slide--image__wrapper">
                <img
                  class="slide--image"
                  src="./assests/Ana Sayfa/giant-LED-screen-7.jpg"
                  alt="Image 1"
                />
              </div>
            </div>
          </div>
          <div
            class="slide__bg"
            style="
              --bg: url(&quot;./assests/Ana Sayfa/giant-LED-Screen-7.jpg&quot;);
              --dir: 0;
            "
            data-current
          ></div>

          <div class="slide" data-next>
            <div class="slide__inner">
              <div class="slide--image__wrapper">
                <img
                  class="slide--image"
                  src="./assests/Ana Sayfa/drone.jpg"
                  alt="Image 2"
                />
              </div>
            </div>
          </div>
          <div
            class="slide__bg"
            style="
              --bg: url(&quot;./assests/Ana Sayfa/drone.jpg&quot;);
              --dir: 0;
            "
            data-next
          ></div>

          <div class="slide" data-previous>
            <div class="slide__inner">
              <div class="slide--image__wrapper">
                <img
                  class="slide--image"
                  src="./assests/Ana Sayfa/hologram.jpg"
                  alt="Image 3"
                />
              </div>
            </div>
          </div>
          <div
            class="slide__bg"
            style="
              --bg: url(&quot;./assests/Ana Sayfa/hologram.jpg&quot;);
              --dir: 0;
            "
            data-previous
          ></div>
        </div>
        <div class="slides--infos">
          <!-- Slide Info 1 -->
          <div class="slide-info" data-current>
            <div class="slide-info__inner">
              <div class="slide-info--text__wrapper">
                <div data-title class="slide-info--text">
                  <span>LED Ekranlar</span>
                </div>
                <div data-subtitle class="slide-info--text">
                  <span></span>
                </div>
                <div data-description class="slide-info--text">
                  <span></span>
                </div>
              </div>
            </div>
          </div>

          <!-- Slide Info 2 -->
          <div class="slide-info" data-next>
            <div class="slide-info__inner">
              <div class="slide-info--text__wrapper">
                <div data-title class="slide-info--text">
                  <span>Drone Showları</span>
                </div>
                <div data-subtitle class="slide-info--text">
                  <span></span>
                </div>
                <div data-description class="slide-info--text">
                  <span></span>
                </div>
              </div>
            </div>
          </div>

          <!-- Slide Info 3 -->
          <div class="slide-info" data-previous>
            <div class="slide-info__inner">
              <div class="slide-info--text__wrapper">
                <div data-title class="slide-info--text">
                  <span>Hologram Sistemleri</span>
                </div>
                <div data-subtitle class="slide-info--text">
                  <span></span>
                </div>
                <div data-description class="slide-info--text">
                  <span></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <button class="slider--btn slider--btn__next">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m9 18 6-6-6-6" />
        </svg>
      </button>
    </div>

    <div class="logo-band">
      <div class="logo-track">
        <div class="logo-item">
          <img src="assests/Ana Sayfa/tomorrowland.png" alt="Brand 1" />
        </div>
        <div class="logo-item">
          <img src="assests/Ana Sayfa/türkTelekom.png" alt="Brand 2" />
        </div>
        <div class="logo-item">
          <img src="assests/Ana Sayfa/uefa.png" alt="Brand 3" />
        </div>
        <div class="logo-item">
          <img src="assests/Ana Sayfa/zorlu.jpeg" alt="Brand 4" />
        </div>
      </div>
    </div>

    <footer class="footer">
      <div>
        <h1 class="logo">Visually</h1>
        <h3>İletişime geçin</h3>
        <div style="display: flex; flex-direction: row">
          <form class="form">
            <div class="form-group">
              <label for="name">Adınız:</label>
              <input class="input" type="text" placeholder="Adınız" />
            </div>
            <div class="form-group">
              <label for="email">Email:</label>
              <input class="input" type="email" placeholder="Email" />
            </div>
            <div class="form-group">
              <label for="message">Mesajınız:</label>
              <textarea class="input" placeholder="Mesajınız"></textarea>
            </div>
            <button class="button" type="submit">Gönder</button>
          </form>
        </div>
      </div>
      <nav class="navbar-footer">
        <ul>
          <li><a href="">Çerez Politikası</a></li>
          <li><a href="">KVKK</a></li>
          <li><a href="">Gizlilik Politikası</a></li>
          <li><a href="">Çerez Tercihleri</a></li>
        </ul>
        <p class="footer-copy">
          ©2026 Visually Entertainment tüm hakları saklıdır
        </p>
      </nav>
    </footer>

    <div class="loader">
      <span class="loader__text">0%</span>
    </div>
  </body>
</html>
